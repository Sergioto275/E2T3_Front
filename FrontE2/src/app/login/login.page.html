<ion-content [fullscreen]="true" class="ion-padding bg-white">
  <div class="container">
    <div class="logo-container">
      <img src="assets/IMP_Logotipoa.png" alt="Santurtzi Logo" class="logo" />
    </div>

    <div class="login-card">
      <!-- Language Selector -->
      <div class="language-selector">
        <span (click)="selectLanguage('es')" [class.selected]="selectedLanguage === 'es'">ES</span>
        <span class="separator">|</span>
        <span (click)="selectLanguage('eu')" [class.selected]="selectedLanguage === 'eu'">EU</span>
      </div>

      <!-- Message Card -->
      <ion-card *ngIf="loginMessage" [color]="loginMessageType === 'error' ? 'danger' : 'success'" class="message-card">
        <ion-card-content>
          <ion-icon [name]="loginMessageType === 'error' ? 'alert-circle' : 'checkmark-circle'" slot="start"></ion-icon>
          <p>{{ loginMessage }}</p>
        </ion-card-content>
      </ion-card>

      <!-- Login Form -->
      <ion-list lines="none" class="auth-list">
        <ion-item class="auth-item" [class.invalid]="submitted && !username">
          <ion-icon name="person-outline" slot="start" class="input-icon"></ion-icon>
          <ion-input 
            type="text" 
            placeholder="{{ 'login.user' | translate }}" 
            [(ngModel)]="username"
            class="custom-input"
            autocomplete="username">
          </ion-input>
        </ion-item>
        
        <ion-item class="auth-item" [class.invalid]="submitted && !password">
          <ion-icon name="lock-closed-outline" slot="start" class="input-icon"></ion-icon>
          <ion-input 
            type="password" 
            placeholder="{{ 'login.password' | translate }}" 
            [(ngModel)]="password"
            class="custom-input"
            autocomplete="current-password">
          </ion-input>
        </ion-item>
      </ion-list>
    
      <ion-button expand="block" class="login-button" (click)="onLogin()" shape="round">
        <ion-icon name="log-in-outline" slot="start"></ion-icon>
        <b>{{ 'login.boton' | translate }}</b>
      </ion-button>
    </div>
  </div>
</ion-content>
