<app-header></app-header>
<!-- <ion-content class="ion-page" id="main-content"> -->
  <ion-header>
    <ion-toolbar class="Headeraaa" style="--background: #1c345c; --color: white;">
      <ion-buttons slot="start">
        <ion-menu-button style="--color: white;"></ion-menu-button>
      </ion-buttons>
      <ion-title size="large" style="color: white;">{{ 'graficos.title' | translate }}</ion-title>
      <ion-select
        slot="end"
        [(ngModel)]="selectedLanguage"
        (ionChange)="changeLanguage()"
        style="--color: white; --placeholder-color: white; --border-color: white;"
      >
        <ion-select-option value="es" style="--color: #1c345c;">Español</ion-select-option>
        <ion-select-option value="eu" style="--color: #1c345c;">Euskera</ion-select-option>
      </ion-select>
       <!-- Icono dinámico modo oscuro/claro -->
       <ion-buttons slot="primary">
        <ion-button fill="clear" (click)="ponerModoOscuro()" class="theme-toggle">
          <ion-icon *ngIf="modoOscuro" name="moon-outline"></ion-icon>
          <ion-icon *ngIf="!modoOscuro" name="sunny-outline"></ion-icon>
        </ion-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
  
  <ion-content [fullscreen]="true">
    <ng-container *ngFor="let taldea of langileak">
      <!-- Categoría -->
      <ion-card>
        <ion-item button (click)="toggleCategoria(taldea.izena)" detail="false">
          <ion-label><strong>{{ taldea.izena }}</strong></ion-label>
          <ion-icon [name]="isCategoriaAbierta(taldea.izena) ? 'chevron-up' : 'chevron-down'" slot="end"></ion-icon>
        </ion-item>
  
        <!-- Lista de productos dentro de la categoría -->
        <ion-list *ngIf="isCategoriaAbierta(taldea.izena)">
          <ion-item *ngFor="let langile of taldea.langileak" (click)="openGraphModal(langile)">
            <ion-label> {{ langile.izena }}</ion-label>
            <ion-label> {{ langile.abizenak }} </ion-label>
          </ion-item>
        </ion-list>
      </ion-card>
    </ng-container>
  
    <ion-modal [isOpen]="isGraphOpen" (ionModalDidDismiss)="closeGraphModal()" trigger="openGraphModal">
      <ng-template>
        <ion-header>
          <ion-toolbar color="primary">
            <ion-title>📊 {{ 'graficos.graf' | translate }}</ion-title>
            <ion-buttons slot="end">
              <ion-button class="close-icon" (click)="closeGraphModal()">
                <ion-icon name="close" slot="icon-only"></ion-icon>
              </ion-button>
            </ion-buttons>
          </ion-toolbar>
        </ion-header>
      
        <ion-content class="ion-padding">
          <ion-card>
            <ion-card-header>
              <ion-card-title>📈 {{ 'graficos.analisis' | translate }} </ion-card-title>
            </ion-card-header>
            <ion-card-content>
              <canvas #graph *ngIf="isGraphOpen" id="myChart"></canvas>
            </ion-card-content>
          </ion-card>
          <ion-button expand="full" color="success" (click)="descargarGrafico()">
            <ion-icon name="download-outline"></ion-icon> Descargar PDF
          </ion-button>
        </ion-content>
      </ng-template>
    </ion-modal>
    
    
  </ion-content>
<!-- </ion-content> -->
